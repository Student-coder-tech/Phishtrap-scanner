<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PHISHTRAP — Multi-Signal Phishing Detection Engine</title>
    <meta name="description" content="Production-quality cybersecurity platform analyzing URLs and domains across multiple intelligence signals to detect phishing attacks in real time." />
    <meta property="og:title" content="PHISHTRAP — Multi-Signal Phishing Detection Engine" />
    <meta property="og:description" content="Production-quality cybersecurity platform analyzing URLs and domains across multiple intelligence signals to detect phishing attacks in real time." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('phishtrap-theme') || localStorage.getItem('phishtrap_theme');
          var isDark = true;
          if (saved === 'light') {
            isDark = false;
          } else if (saved === 'dark') {
            isDark = true;
          } else if (saved === 'system' || !saved) {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
